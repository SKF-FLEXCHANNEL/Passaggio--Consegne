<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passaggio Consegne HMI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <nav class="tabs">
        <button class="tab active" data-zone="zona1">Zona 1</button>
        <button class="tab" data-zone="zona2">Zona 2</button>
        <button class="tab" data-zone="zona3">Zona 3</button>
      </nav>
      <h2 id="zoneTitle">ZONA 1</h2>
      
      <div class="map-wrap" id="mapWrap">
        <img id="zoneImage" src="img/zona1.jpg" />
        <svg id="markersLayer" viewBox="0 0 100 100" preserveAspectRatio="none">
        </svg>
      </div>
    </section>

    <aside id="panel" class="panel">
      <h2 id="pointInfo">Seleziona Punto</h2>
      <div id="anomalyList"></div>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
